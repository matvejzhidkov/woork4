# docker-compose.prod.yml
# Production stack: Mattermost 12.0.1 + PostgreSQL 15
services:
  mattermost:
    image: mattermost/mattermost-team-edition:12.0.1
    container_name: mattermost
    ports:
      - "8065:8065"
    environment:
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://mmuser:${DB_POSTGRES_PASSWORD}@mattermost-postgres:5432/mattermost?sslmode=disable
      - MM_SERVICESETTINGS_SITEURL=http://localhost:8065
      - MM_TEAMSSETTINGS_ENABLEOPENSERVER=false
    volumes:
      # ВАЖНО: тот же именованный том, что в legacy — сохраняет аватары и вложения
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
    networks:
      - mattermost_network
    depends_on:
      - mattermost-postgres
    restart: unless-stopped

  mattermost-postgres:
    image: postgres:15-alpine
    container_name: mattermost-postgres
    environment:
      - POSTGRES_USER=mmuser
      - POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      - POSTGRES_DB=mattermost
      - TZ=UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mattermost_network
    restart: unless-stopped

networks:
  mattermost_network:
    driver: bridge

volumes:
  mattermost_data:      # объявлен и в legacy-стеке — данные сохранятся
  mattermost_logs:
  postgres_data:
