      - name: Run pgloader (Idempotent with include drop)
        if: steps.check_status.outputs.already_migrated == 'false'
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
          DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}
        run: |
          $NETWORK_NAME = (docker inspect mattermost-postgres -f '{{range $key, $value := .NetworkSettings.Networks}}{{$key}} {{end}}').Trim().Split(" ")[0]
          
          if ([string]::IsNullOrWhiteSpace($NETWORK_NAME)) {
            echo "Error: Could not find network for mattermost-postgres!"
            exit 1
          }
          
          echo "Using network: $NETWORK_NAME"
          
          # Проверяем, подключен ли MySQL к этой сети, и подключаем, если нет
          $isConnected = (docker inspect mattermost-mysql -f '{{range $key, $value := .NetworkSettings.Networks}}{{$key}} {{end}}') -match $NETWORK_NAME
          if (-not $isConnected) {
            docker network connect $NETWORK_NAME mattermost-mysql
          }
          
          docker run --rm --network=$NETWORK_NAME `
            mattermost/mattermost-pgloader:latest `
            pgloader `
            --with "include drop" `
            "mysql://root:$env:MYSQL_ROOT_PASSWORD@mattermost-mysql:3306/mattermost" `
            "postgresql://mmuser:$env:DB_POSTGRES_PASSWORD@mattermost-postgres:5432/mattermost"
